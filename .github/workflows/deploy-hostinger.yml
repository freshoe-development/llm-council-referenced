# Deploy to Hostinger VPS over SSH.
#
# Manual, controlled deploy: runs scripts/deploy.sh on the server via SSH.
# The SSH key never lives in the repo — it is read from GitHub Actions secrets.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  - the private key whose public half is in the VPS authorized_keys
#   SSH_HOST         - e.g. srv1357811.hstgr.cloud
#   SSH_USER         - e.g. root
# Optional:
#   SSH_PORT         - defaults to 22
# Optional repository variable:
#   APP_DIR          - path to the checkout on the server (default: ~/llm-council-referenced)

name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "hostinger-deploy"

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Missing required secrets SSH_PRIVATE_KEY and/or SSH_HOST"
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Prefer a pinned host key (SSH_KNOWN_HOSTS secret) to avoid MITM.
          # Fall back to ssh-keyscan only if it is not provided (with a warning).
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Using pinned SSH_KNOWN_HOSTS."
          else
            echo "::warning::SSH_KNOWN_HOSTS not set — trusting ssh-keyscan (MITM risk). Pin it for production."
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          # Validate inputs to a safe charset before they reach the remote shell,
          # preventing command injection / word-splitting in the ssh command.
          if ! printf '%s' "$REF" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid ref '${REF}': allowed chars are [A-Za-z0-9._/-]"
            exit 1
          fi
          DIR="${APP_DIR:-~/llm-council-referenced}"
          if ! printf '%s' "$DIR" | grep -qE '^[A-Za-z0-9._/~-]+$'; then
            echo "::error::Invalid APP_DIR '${DIR}': allowed chars are [A-Za-z0-9._/~-]"
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          USER="${SSH_USER:-root}"
          echo "Deploying ref '${REF}' to ${USER}@${SSH_HOST}:${DIR}"
          ssh -p "$PORT" -o BatchMode=yes "${USER}@${SSH_HOST}" \
            "set -e; cd ${DIR}; git fetch origin '${REF}'; git checkout '${REF}'; if git symbolic-ref -q HEAD >/dev/null; then git pull --ff-only origin '${REF}' || true; fi; DEPLOY_BRANCH='${REF}' ./scripts/deploy.sh"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
